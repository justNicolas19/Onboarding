spring.application.name=onboarding

# Perfil local por defecto: carga application-local.properties si existe (no se versiona).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Base de datos: se definen por variables de entorno o en application-local.properties ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Pocas conexiones: Supabase limita las simultáneas en el plan gratuito
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=onboarding
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT (hueco 1 del reporte). En producción definir JWT_SECRET: Base64 de al menos 32 bytes ---
onboarding.jwt.secret=${JWT_SECRET:ZGVzYXJyb2xsby1vbmJvYXJkZ28tY2FtYmlhci1lc3RlLXNlY3JldG8tMjU2LWJpdHM=}
onboarding.jwt.expiracion-horas=${JWT_HORAS:8}

# --- Primer administrador (solo se crea si no existe ninguno) ---
onboarding.admin.correo=${ADMIN_CORREO:admin@empresa.com}
onboarding.admin.contrasena=${ADMIN_CONTRASENA:}

# --- Cuentas del prototipo del Figma (Lucía, Elena, Administración). Solo para demo ---
onboarding.demo.enabled=${DEMO_ENABLED:false}
onboarding.demo.contrasena=${DEMO_CONTRASENA:Onboard2026}

# --- Moodle: plantilla del enlace "Abrir en Moodle"; {id} se reemplaza por el idMoodle del módulo ---
onboarding.moodle.url-actividad=${MOODLE_URL_ACTIVIDAD:https://moodle.empresa.com/mod/page/view.php?id={id}}

# --- Reservas: horario y tamaño de las franjas del calendario de ocupación ---
onboarding.reservas.hora-inicio=08:00
onboarding.reservas.hora-fin=18:00
onboarding.reservas.franja-minutos=30

# --- Fotos de perfil ("JPG o PNG · máximo 5 MB") ---
onboarding.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
