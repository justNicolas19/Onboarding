spring.application.name=onboarding

# Carga application-local.properties, donde van las credenciales
spring.profiles.active=local

# --- Base de datos: en otros entornos se definen por variables de entorno ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pocas conexiones: Supabase limita las simultáneas en el plan gratuito
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=onboarding
spring.jpa.open-in-view=false
spring.jpa.show-sql=false